plugins {
    id 'com.android.application'
}

// CI passes the release keystore as base64 in RELEASE_KEYSTORE_BASE64.
def releaseKeystore = null
def releaseKeystoreBase64 = System.getenv('RELEASE_KEYSTORE_BASE64')
if (releaseKeystoreBase64) {
    releaseKeystore = layout.buildDirectory.file('release.keystore').get().asFile
    releaseKeystore.parentFile.mkdirs()
    releaseKeystore.bytes = releaseKeystoreBase64.decodeBase64()
}

android {
    namespace = 'com.brouken.runner'

    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId = "com.brouken.runner"
        minSdk {
            version = release(26)
        }
        targetSdk {
            version = release(37)
        }
        versionCode = 14
        versionName = "0.${versionCode}"
    }

    signingConfigs {
        // Committed so local and CI builds share one key and can update each other.
        debug {
            storeFile = file('debug.keystore')
            storePassword = 'android'
            keyAlias = 'androiddebugkey'
            keyPassword = 'android'
        }
        if (releaseKeystore != null) {
            release {
                storeFile = releaseKeystore
                storePassword = System.getenv('RELEASE_KEYSTORE_PASSWORD')
                keyAlias = System.getenv('RELEASE_KEY_ALIAS')
                keyPassword = System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // Without the release secrets, fall back to the debug key so the APK still installs.
            signingConfig = releaseKeystore != null ? signingConfigs.release : signingConfigs.debug
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            output.outputFileName.set("runner-dyon-${android.defaultConfig.versionName}.apk")
        }
    }
}

tasks.register('printVersionName') {
    doLast {
        println(android.defaultConfig.versionName)
    }
}

dependencies {

}
